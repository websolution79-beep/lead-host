name: Disaster recovery backup

on:
  workflow_dispatch:
  schedule:
    - cron: "27 2 * * *"

permissions:
  contents: read

concurrency:
  group: lead-host-disaster-recovery-backup
  cancel-in-progress: false

jobs:
  database:
    name: Database cifrato
    if: github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      encrypted_bytes: ${{ steps.upload.outputs.encrypted_bytes }}
    env:
      SUPABASE_DB_URL: ${{ secrets.BACKUP_SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_PREFIX: lead-host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze backup
        run: npm ci --ignore-scripts

      - name: Client PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET BACKUP_ENCRYPTION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret obbligatorio mancante: ${name}"
              exit 1
            fi
          done

      - name: Dump consistente e verifica
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          workdir="${RUNNER_TEMP}/lead-host-backup"
          mkdir -p "$workdir"
          plain_file="${workdir}/${timestamp}.dump"
          encrypted_file="${plain_file}.enc"

          PGOPTIONS='-c statement_timeout=0' /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --lock-wait-timeout=5s \
            --file="$plain_file"

          test -s "$plain_file"
          /usr/lib/postgresql/17/bin/pg_restore --list "$plain_file" > "${workdir}/${timestamp}.contents.txt"
          test -s "${workdir}/${timestamp}.contents.txt"
          node scripts/backup/encrypt-file.mjs encrypt "$plain_file" "$encrypted_file"
          test -s "$encrypted_file"

          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "plain_file=$plain_file" >> "$GITHUB_OUTPUT"
          echo "encrypted_file=$encrypted_file" >> "$GITHUB_OUTPUT"

      - name: Carica database su R2
        id: upload
        env:
          BACKUP_TIMESTAMP: ${{ steps.dump.outputs.timestamp }}
          BACKUP_PLAIN_FILE: ${{ steps.dump.outputs.plain_file }}
          BACKUP_ENCRYPTED_FILE: ${{ steps.dump.outputs.encrypted_file }}
        run: node scripts/backup/upload-database-backup.mjs

      - name: Elimina temporanei locali
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/lead-host-backup"

  storage:
    name: Supabase Storage incrementale
    if: github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      objects: ${{ steps.storage_backup.outputs.objects }}
      uploaded: ${{ steps.storage_backup.outputs.uploaded }}
      reused: ${{ steps.storage_backup.outputs.reused }}
    env:
      SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_PREFIX: lead-host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze backup
        run: npm ci --ignore-scripts

      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET BACKUP_ENCRYPTION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret obbligatorio mancante: ${name}"
              exit 1
            fi
          done

      - name: Timestamp backup
        id: timestamp
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H-%M-%SZ')" >> "$GITHUB_OUTPUT"

      - name: Copia incrementale cifrata
        id: storage_backup
        env:
          BACKUP_TIMESTAMP: ${{ steps.timestamp.outputs.value }}
        run: node scripts/backup/backup-storage.mjs

  verify:
    name: Verifica backup esterno
    needs: [database, storage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      BACKUP_PREFIX: lead-host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dipendenze backup
        run: npm ci --ignore-scripts
      - name: Controlla manifesti e oggetti
        run: node scripts/backup/verify-r2-backup.mjs

  report:
    name: Aggiorna monitoraggio Admin
    if: always() && (github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true')
    needs: [database, storage, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Registra esito sanitizzato
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_RUN_ID: ${{ github.run_id }}
          BACKUP_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKUP_COMPONENTS_JSON: >-
            [
              {"component":"database","status":"${{ needs.database.result }}","metadata":{"encryptedBytes":"${{ needs.database.outputs.encrypted_bytes }}"}},
              {"component":"storage","status":"${{ needs.storage.result }}","metadata":{"objects":"${{ needs.storage.outputs.objects }}","uploaded":"${{ needs.storage.outputs.uploaded }}","reused":"${{ needs.storage.outputs.reused }}"}},
              {"component":"verification","status":"${{ needs.verify.result }}","metadata":{}}
            ]
        run: node scripts/backup/report-backup-status.mjs
